  - " &#00ACFF/leave cancel &7—&f отменить выход"
  - " &#00ACFF/darena join [мир] &7—&f войти на арену"
  - " &#00ACFF/darena reload &7—&f перезагрузить конфиги"
  - " &#00ACFF/darena status &7—&f состояние плагина"
  - " &#00ACFF/darena kick <игрок> &7—&f убрать игрока с арены"
  - " &#00ACFF/darena world <add|remove|setspawn|list> &7—&f миры арены"
  - " &#00ACFF/darena setexit &7—&f запасная точка выхода"
  - " &#00ACFF/darena npc <create|remove|list> &7—&f NPC арены"
