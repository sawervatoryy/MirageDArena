  world-added: "{prefix} &fМир ‹&#00ACFF{world}&f› добавлен в список арен."
  world-removed: "{prefix} &fМир ‹&#00ACFF{world}&f› убран из списка арен."
  world-exists: "{prefix} &fМир ‹&#00ACFF{world}&f› уже в списке арен."
  world-not-found: "{prefix} &fМир ‹&#00ACFF{world}&f› не найден на сервере или в списке арен."
  world-list-header: "{prefix} &fМиры арены (&#00ACFF{count}&f):"
  world-list-entry: " &#00ACFF› &f{key} &7—&f {display}"
  status: "{prefix} &fНа арене: &#00ACFF{players} &fигроков, NPC: &#00ACFF{npcs}&f, провайдеров PvP: &#00ACFF{providers}&f."
  forced-leave: "{prefix} &fИгрок &#00ACFF{player} &fудалён с арены."
  player-not-found: "{prefix} &fИгрок не найден или не на арене."

help:
  - "&#00ACFF⌈&f MirageDArena v0.1 Pre-Release &#00ACFF⌋"
