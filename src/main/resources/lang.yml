# MirageDArena v0.1 Pre-Release — lang.yml
# Основной цвет: &f, выделительный: &#00ACFF. HEX задаётся как &#RRGGBB.
# {prefix} подставляется автоматически. Пустая строка "" отключает сообщение.

prefix: "&#00ACFF⌈&f MirageDArena &#00ACFF⌋&f"

general:
  no-permission: "{prefix} &fУ вас нет прав на это действие."
  players-only: "{prefix} &fЭта команда доступна только игрокам."
  unknown-subcommand: "{prefix} &fНеизвестная подкоманда. Список: &#00ACFF/darena help"

arena:
  joined: "{prefix} &fВы вошли на арену ‹&#00ACFF{world}&f›. Выйти: &#00ACFF/leave &fили через NPC."
  already-in: "{prefix} &fВы уже находитесь на арене."
  not-in: "{prefix} &fВы не находитесь на арене."
  world-unavailable: "{prefix} &fМир арены ‹&#00ACFF{world}&f› сейчас недоступен."
  join-cancelled: "{prefix} &fВход на арену отменён."
  join-disabled: "{prefix} &fВход по команде отключён — найдите NPC."
  teleport-failed: "{prefix} &fНе удалось телепортировать вас."
  left: "{prefix} &fВы покинули арену."
  restored: "{prefix} &fВы вернулись на арену. PvP-режим активен."
  forced-out: "{prefix} &fВы покинули арену."

leave:
  started: "{prefix} &fВыход с арены через &#00ACFF{seconds} &fсек. Не двигайтесь! Отмена: &#00ACFF/leave cancel"
  started-npc: "{prefix} &fВыход через NPC: &#00ACFF{seconds} &fсек. Не двигайтесь!"
  already-leaving: "{prefix} &fВы уже покидаете арену — осталось &#00ACFF{seconds} &fсек."
  shortened: "{prefix} &fВремя выхода сокращено — осталось &#00ACFF{seconds} &fсек."
  cancelled: "{prefix} &fВыход с арены отменён."
  cancelled-move: "{prefix} &fВы сдвинулись — выход отменён."
  cancelled-damage: "{prefix} &fВы получили урон — выход отменён."
  nothing-to-cancel: "{prefix} &fВы сейчас не покидаете арену."
  actionbar: "&#00ACFF‹ &fВыход через &#00ACFF{seconds} &fсек &#00ACFF›"
  title: "&#00ACFF{seconds}"
  subtitle: "&fНе двигайтесь"

commands:
  blocked: "{prefix} &fНа арене доступны только: &#00ACFF/leave&f."

npc:
  created: "{prefix} &fNPC ‹&#00ACFF{id}&f› создан (роль: &#00ACFF{role}&f)."
  removed: "{prefix} &fNPC ‹&#00ACFF{id}&f› удалён."
  not-found: "{prefix} &fNPC ‹&#00ACFF{id}&f› не найден."
  exists: "{prefix} &fNPC ‹&#00ACFF{id}&f› уже существует."
  invalid-id: "{prefix} &fID может содержать только латиницу, цифры, «_» и «-» (до 32 символов)."
  invalid-role: "{prefix} &fРоль должна быть &#00ACFFjoin &fили &#00ACFFleave&f."
  list-header: "{prefix} &fNPC арены (&#00ACFF{count}&f):"
